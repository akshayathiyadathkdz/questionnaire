<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Design Brief Questionnaire — Kidzink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=New+Kansas:wght@400;700&display=swap');

  :root{
    --paper:#F5F2EC;
    --ink:#404040;
    --ink-soft:#5B564F;
    --brick:#e43e2f;
    --brick-deep:#c53527;
    --ochre:#C08A28;
    --sage:#5B6B54;
    --line:#DDD3C2;
    --card:#FCFAF6;
    --label-color:rgba(0,0,0,0.8);
    --answer-color:rgba(0,0,0,0.5);
    --meta-value-color:#5c5c60;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .brandbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:28px;
  }
  .brandbar .mark{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.01em;
  }
  .brandbar .mark span{
    font-family:'New Kansas', sans-serif;
    font-weight:600;
    color:var(--brick);
  }
  .brandbar .meta{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .hero{
    margin-bottom:34px;
  }
  .hero h1{
    font-family:'New Kansas', sans-serif;
    font-weight:700;
    font-size:28px;
    line-height:1.2;
    margin:0 0 10px;
    max-width:640px;
    color:var(--brick);
  }
  .hero p{
    font-size:15px;
    color:var(--ink-soft);
    max-width:560px;
    line-height:1.6;
    margin:0;
  }

  .layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:36px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
    .rail{ display:none; }
  }

  .rail{
    position:sticky;
    top:24px;
  }
  .rail-item{
    display:flex;
    gap:12px;
    padding:10px 0;
    cursor:pointer;
    border-bottom:1px solid transparent;
  }
  .rail-num{
    font-family:'Poppins', sans-serif;
    font-size:13px;
    color:var(--line);
    width:18px;
    flex-shrink:0;
    padding-top:1px;
  }
  .rail-item.active .rail-num{ color:var(--brick); }
  .rail-item.done .rail-num{ color:var(--sage); }
  .rail-label{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .rail-item.active .rail-label{ color:var(--ink); font-weight:500; }

  .progressbar{
    height:2px;
    background:var(--line);
    margin:16px 0 4px;
    position:relative;
  }
  .progressbar > div{
    height:100%;
    background:var(--brick);
    transition:width .3s ease;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    padding:34px 36px;
    min-height:420px;
    border-radius:12px;
  }
  .panel h2{
    font-family:'New Kansas', sans-serif;
    font-weight:600;
    font-size:20px;
    line-height:32px;
    letter-spacing:-0.2px;
    margin:0 0 6px;
    color:var(--brick);
  }
  .panel .subnote{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
    line-height:1.55;
    max-width:560px;
  }

  .q{
    margin-bottom:28px;
  }
  .q label{
    display:block;
    font-family:'Poppins', sans-serif;
    font-size:15px;
    font-weight:500;
    letter-spacing:-0.3px;
    color:var(--label-color);
    margin-bottom:8px;
    line-height:1.4;
  }
  .q .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:-2px 0 8px;
  }
  .q input[type=text], .q textarea{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    padding:10px 12px;
    font-family:'Poppins', sans-serif;
    font-size:14px;
    color:var(--ink);
    resize:vertical;
    border-radius:4px;
  }
  .q textarea{ min-height:64px; }
  .q input[type=text]:focus, .q textarea:focus{
    outline:none;
    border-color:var(--brick);
  }
  .q input[type=file]{
    display:block;
    padding:8px 0;
    font-size:14px;
    margin-top:8px;
  }
  .file-with-text{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:30px;
  }
  .btn{
    font-family:'Poppins', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:11px 22px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    border-radius:4px;
  }
  .btn:hover{ background:var(--ink); color:var(--paper); }
  .btn.primary{
    background:var(--brick);
    border-color:var(--brick);
    color:#fff;
  }
  .btn.primary:hover{ background:var(--brick-deep); border-color:var(--brick-deep); color:#fff; }
  .btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }
  .btn.ghost{ border-color:var(--line); color:var(--ink-soft); }
  .btn.ghost:hover{ background:var(--line); color:var(--ink); }

  .stepcount{ font-size:12.5px; color:var(--ink-soft); }

  .review-block{
    margin-bottom:40px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .review-block h3{
    font-family:'New Kansas', sans-serif;
    font-size:20px;
    font-weight:600;
    line-height:32px;
    letter-spacing:-0.2px;
    margin:0 0 20px;
    color:var(--brick);
  }
  .review-row{
    font-size:15px;
    letter-spacing:-0.3px;
    line-height:1.4;
    margin-bottom:28px;
  }
  .review-row .rq{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    color:var(--label-color);
    margin-bottom:8px;
  }
  .review-row .ra{
    font-family:'Poppins', sans-serif;
    font-weight:400;
    font-style:italic;
    color:var(--answer-color);
    line-height:1.5;
    white-space:pre-wrap;
  }
  .review-row .empty{ color:#B8AF9F; font-style:italic; }

  .success{
    text-align:center;
    padding:50px 20px;
  }
  .success h2{
    font-family:'New Kansas', sans-serif;
    font-size:28px;
    font-weight:700;
    margin-bottom:10px;
  }
  .success p{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:420px;
    margin:0 auto 24px;
    line-height:1.6;
  }

  .ownerlink{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .ownerlink button{
    background:none;
    border:none;
    color:var(--brick);
    text-decoration:underline;
    cursor:pointer;
    font-size:12.5px;
    padding:0;
    font-weight:500;
  }

  .admin-panel{
    background:var(--card);
    border:1px solid var(--line);
    padding:34px 36px;
    border-radius:12px;
  }
  .admin-panel h2{
    font-family:'New Kansas', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0;
    color:var(--brick);
  }
  .subm-card{
    border:1px solid var(--line);
    background:#fff;
    padding:20px 22px;
    margin-bottom:16px;
    border-radius:12px;
  }
  .subm-card .subm-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .subm-card .subm-head b{
    font-family:'New Kansas', sans-serif;
    font-size:16px;
    font-weight:700;
  }
  .subm-card .subm-head span{ font-size:12px; color:var(--ink-soft); }
  .loadmsg{ font-size:13.5px; color:var(--ink-soft); text-align:center; padding:40px 0; }
  .error-msg{ color:var(--brick); padding:12px; background:#fff; border:1px solid var(--brick); border-radius:4px; margin:10px 0; }
  .btn-sm{
    font-family:'Poppins', sans-serif;
    font-size:12px;
    font-weight:500;
    padding:7px 14px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:4px;
    white-space:nowrap;
  }
  .btn-sm:hover{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .admin-head-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:6px;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.5.0/build/pdfmake.min.js"></script>

function renderRail(){
  const rail = document.getElementById('rail');
  let html = '';
  SECTIONS.forEach((s,i)=>{
    const cls = i===current ? 'active' : (i<current ? 'done' : '');
    html += `<div class="rail-item ${cls}" onclick="jumpTo(${i})">
      <div class="rail-num">${String(i+1).padStart(2,'0')}</div>
      <div class="rail-label">${s.title}</div>
    </div>`;
  });
  html += `<div class="progressbar"><div style="width:${(current/(SECTIONS.length))*100}%"></div></div>`;
  rail.innerHTML = html;
}

function jumpTo(i){ current = i; renderAll(); }

function renderPanel(){
  const area = document.getElementById('panelArea');
  const s = SECTIONS[current];
  let fieldsHtml = '';
  s.fields.forEach(f=>{
    const val = answers[f.id] || '';
    fieldsHtml += `<div class="q">
      <label for="${f.id}">${f.label}</label>
      ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}`;

    if(f.file){
      fieldsHtml += `<div class="file-with-text">
        <input type="text" id="${f.id}" placeholder="Describe the logo or paste details..." value="${val}" oninput="answers['${f.id}']=this.value" style="flex:1;">
        <input type="file" id="${f.id}_file" accept=".png,.jpg,.jpeg,.pdf,.gif" onchange="handleFileUpload('${f.id}', this)">
      </div>`;
    } else if(f.type==='textarea'){
      fieldsHtml += `<textarea id="${f.id}" oninput="answers['${f.id}']=this.value">${val}</textarea>`;
    } else {
      fieldsHtml += `<input type="text" id="${f.id}" value="${val}" oninput="answers['${f.id}']=this.value">`;
    }
    fieldsHtml += `</div>`;
  });

  area.innerHTML = `
    <div class="panel">
      <h2>${s.title}</h2>
      ${s.note ? `<p class="subnote">${s.note}</p>` : ''}
      ${fieldsHtml}
      <div class="navrow">
        <button class="btn ghost" onclick="prevStep()" ${current===0?'disabled':''}>Back</button>
        <span class="stepcount">Section ${current+1} of ${SECTIONS.length}</span>
        <button class="btn primary" onclick="nextStep()">${current===SECTIONS.length-1 ? 'Review & Send' : 'Next'}</button>
      </div>
    </div>
  `;
}

function nextStep(){
  if(current < SECTIONS.length - 1){
    current++;
    renderAll();
  } else {
    renderReview();
  }
}

function prevStep(){
  if(current > 0){ current--; renderAll(); }
}

function renderAll(){
  renderRail();
  renderPanel();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderReview(){
  const area = document.getElementById('panelArea');
  document.getElementById('rail').innerHTML = '';
  let html = `<div class="panel">
    <h2>Review your answers</h2>
    <p class="subnote">Take a look before sending — you can go back and edit anything.</p>`;
  SECTIONS.forEach(s=>{
    html += `<div class="review-block"><h3>${s.title}</h3>`;
    s.fields.forEach(f=>{
      const val = answers[f.id];
      html += `<div class="review-row">
        <div class="rq">${f.label}</div>
        <div class="ra ${!val ? 'empty' : ''}">${val ? val : 'No response'}</div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `
    <div class="navrow">
      <button class="btn ghost" onclick="renderAll()">Back to edit</button>
      <span></span>
      <button class="btn primary" onclick="submitForm()">Send</button>
    </div>
  </div>`;
  area.innerHTML = html;
}

function handleFileUpload(fieldId, input){
  const file = input.files[0];
  if(!file) return;

  if(file.size > 5 * 1024 * 1024){
    alert('File is too large. Maximum file size is 5MB.');
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result;
    answers[fieldId + '_file'] = {
      name: file.name,
      type: file.type,
      size: file.size,
      data: base64
    };
  };
  reader.readAsDataURL(file);
}

async function submitForm(){
  const submission = {
    respondent_name: answers.respName || 'Unnamed',
    respondent_email: answers.respEmail || '',
    respondent_role: answers.respRole || '',
    respondent_date: answers.respDate || '',
    answers: answers
  };

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/design_brief_submissions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(submission)
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.message || 'Failed to submit form');
    }

    // Send email notifications to team members
    try {
      await sendNotificationEmails(submission);
    } catch(emailError) {
      console.warn('Email notification failed (non-blocking):', emailError);
      // Don't fail the submission if email fails
    }

    showSuccess();
  } catch(error) {
    console.error('Error:', error);
    alert('Error submitting form: ' + error.message);
  }
}

function showSuccess(){
  document.getElementById('rail').innerHTML = '';
  document.getElementById('panelArea').innerHTML = `
    <div class="panel success">
      <h2>Thank you.</h2>
      <p>Your feedback has been submitted successfully. We appreciate you taking the time to share your thoughts with us. Our team will review your responses and get back to you soon.</p>
    </div>
  `;
}

  const pwd = prompt('Enter admin password:');
  if(pwd === adminPassword){
    toggleAdminView();
  } else if(pwd !== null){
    alert('Incorrect password');
  }
}

async function toggleAdminView(){
  let adminViewOpen = true;
  const btn = document.querySelector('.ownerlink button');
  if(adminViewOpen){
    btn.textContent = 'Back to questionnaire';
    document.getElementById('heroBlock').style.display = 'none';
    const area = document.getElementById('panelArea');
    document.getElementById('rail').innerHTML = '';
    area.innerHTML = `<div class="loadmsg">Loading responses…</div>`;

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/design_brief_submissions?order=submitted_at.desc`, {
        method: 'GET',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        }
      });

      console.log('Fetch response status:', response.status);
      console.log('Fetch response ok:', response.ok);

      if (!response.ok) {
        const errorText = await response.text();
        console.error('Fetch error response:', errorText);
        throw new Error(`Failed to load responses: ${response.status}`);
      }

      const data = await response.json();
      console.log('Fetched data:', data);
      console.log('Data length:', data ? data.length : 'null');

      window.allSubmissions = data;

      if(!data || data.length === 0){
        area.innerHTML = `<div class="loadmsg">No responses submitted yet.</div>`;
        return;
      }

      let html = `<div class="admin-panel">
        <div class="admin-head-row">
          <div>
            <h2 style="margin:0;">Client Responses</h2>
            <p class="subnote" style="margin:4px 0 0;">Total responses: ${data.length}</p>
          </div>
          <button class="btn-sm" onclick="downloadAllPDF()">⬇ Download All as PDF</button>
        </div>`;
      data.forEach(entry=>{
        html += `<div class="subm-card">
          <div class="subm-head">
            <div>
              <b>${entry.respondent_name || 'Anonymous'}</b><br>
              <span>${new Date(entry.submitted_at).toLocaleString()} ${entry.respondent_email ? '· ' + entry.respondent_email : ''}</span>
            </div>
            <button class="btn-sm" onclick="downloadSubmissionPDF('${entry.id}')">⬇ Download PDF</button>
          </div>`;

        if(entry.respondent_role){
          html += `<div style="margin-bottom:12px;"><strong style="color:var(--ink-soft);">Role:</strong> ${entry.respondent_role}</div>`;
        }
        if(entry.respondent_date){
          html += `<div style="margin-bottom:12px;"><strong style="color:var(--ink-soft);">Date:</strong> ${entry.respondent_date}</div>`;
        }

        SECTIONS.forEach(s=>{
          html += `<div style="margin-bottom:14px;"><div style="font-family:'Poppins',sans-serif;font-size:14px;color:var(--brick-deep);margin-bottom:6px;font-weight:500;">${s.title}</div>`;
          s.fields.forEach(f=>{
            // Parse answers if it's a string
            let answers = entry.answers;
            if(typeof answers === 'string'){
              try {
                answers = JSON.parse(answers);
              } catch(e) {
                answers = {};
              }
            }
            let val = answers ? answers[f.id] : '';
            let displayVal = 'No response';

            if(val){
              // Check if it's a file object (has name property)
              if(typeof val === 'object' && val.name){
                displayVal = `📎 ${val.name} (${(val.size / 1024).toFixed(1)}KB)`;
              } else if(typeof val === 'object'){
                displayVal = JSON.stringify(val);
              } else {
                displayVal = val;
              }
            }

            html += `<div class="review-row">
              <div class="rq">${f.label}</div>
              <div class="ra ${!val ? 'empty' : ''}">${displayVal}</div>
            </div>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
      area.innerHTML = html;
    } catch(error) {
      area.innerHTML = `<div class="error-msg">Error loading responses: ${error.message}</div>`;
    }
  }
}

// ---------- PDF EXPORT (matches Figma document template exactly: colors, type, spacing) ----------
function getParsedAnswers(entry){
  let answers = entry.answers;
  if(typeof answers === 'string'){
    try { answers = JSON.parse(answers); } catch(e) { answers = {}; }
  }
  return answers || {};
}

function safeFileName(name){
  return (name || 'response').toString().replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 60);
}

function escapePdfHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatAnswerForPdf(val){
  if(val === undefined || val === null || val === ''){ return 'No response'; }
  if(typeof val === 'object' && val.name){
    return `Attached file: ${val.name} (${(val.size / 1024).toFixed(1)}KB)`;
  }
  if(typeof val === 'object'){ return JSON.stringify(val); }
  return String(val);
}


function buildPdfDefinition(entry) {
  const answers = getParsedAnswers(entry);
  const colors = {
    brick: '#e43e2f',
    ink: '#404040',
    ink_soft: '#5B564F',
    line: '#DDD3C2',
    bg: '#F5F2EC'
  };

  const content = [];

  // Title
  content.push({
    text: 'Design Brief Questionnaire',
    style: 'title',
    margin: [0, 0, 20, 0]
  });

  // Metadata section
  content.push({
    columns: [
      {
        stack: [
          { text: 'Respondent', style: 'metaLabel' },
          { text: entry.respondent_name || '—', style: 'metaValue' }
        ],
        width: '25%'
      },
      {
        stack: [
          { text: 'Email', style: 'metaLabel' },
          { text: entry.respondent_email || '—', style: 'metaValue' }
        ],
        width: '25%'
      },
      {
        stack: [
          { text: 'Role', style: 'metaLabel' },
          { text: entry.respondent_role || '—', style: 'metaValue' }
        ],
        width: '25%'
      },
      {
        stack: [
          { text: 'Submitted', style: 'metaLabel' },
          { 
            text: entry.submitted_at ? new Date(entry.submitted_at).toLocaleString() : '—',
            style: 'metaValue'
          }
        ],
        width: '25%'
      }
    ],
    margin: [0, 0, 0, 20]
  });

  // Divider
  content.push({
    canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: colors.line }],
    margin: [0, 0, 0, 20]
  });

  // Sections
  SECTIONS.forEach((section, sectionIdx) => {
    // Section heading
    content.push({
      text: section.title,
      style: 'sectionHeading',
      margin: [0, sectionIdx > 0 ? 15 : 0, 0, 12]
    });

    // Section fields
    const fields = [];
    section.fields.forEach(field => {
      const answer = formatAnswerForPdf(answers[field.id]) || '(No answer provided)';
      
      fields.push({
        stack: [
          {
            text: field.label,
            style: 'fieldLabel'
          },
          {
            text: answer,
            style: 'fieldAnswer',
            margin: [10, 4, 0, 0]
          }
        ],
        margin: [0, 0, 0, 12]
      });
    });

    content.push({
      stack: fields,
      margin: [0, 0, 0, 0]
    });
  });

  // PDF definition
  return {
    pageSize: 'A4',
    pageMargins: [40, 40, 40, 40],
    content: content,
    styles: {
      title: {
        fontFamily: 'New Kansas',
        fontSize: 24,
        bold: true,
        color: colors.brick
      },
      sectionHeading: {
        fontFamily: 'Poppins',
        fontSize: 14,
        bold: true,
        color: colors.brick
      },
      fieldLabel: {
        fontFamily: 'Poppins',
        fontSize: 11,
        bold: true,
        color: colors.ink
      },
      fieldAnswer: {
        fontFamily: 'Poppins',
        fontSize: 10,
        color: colors.ink_soft,
        lineHeight: 1.5
      },
      metaLabel: {
        fontFamily: 'Poppins',
        fontSize: 9,
        bold: true,
        color: colors.ink,
        margin: [0, 0, 0, 3]
      },
      metaValue: {
        fontFamily: 'Poppins',
        fontSize: 10,
        color: colors.ink_soft
      }
    },
    defaultStyle: {
      fontFamily: 'Poppins',
      fontSize: 10,
      color: colors.ink
    }
  };
}

function downloadSubmissionPDF(id) {
  try {
    const entry = (window.allSubmissions || []).find(e => String(e.id) === String(id));
    if(!entry) { alert('Could not find that submission.'); return; }

    console.log('PDF: Building definition for', entry.respondent_name);
    const docDefinition = buildPdfDefinition(entry);

    if(!window.pdfMake) {
      alert('PDF library (pdfMake) failed to load.');
      return;
    }

    console.log('PDF: Creating document...');
    const pdf = pdfMake.createPdf(docDefinition);
    
    console.log('PDF: Downloading...');
    pdf.download(`${safeFileName(entry.respondent_name)}_design_brief.pdf`);
    console.log('PDF: Download complete');
  } catch(err) {
    console.error('PDF generation failed:', err);
    alert('PDF Error: ' + err.message);
  }
}

function downloadAllPDF() {
  try {
    const data = window.allSubmissions || [];
    if(data.length === 0) { alert('No responses to download yet.'); return; }

    if(!window.pdfMake) {
      alert('PDF library (pdfMake) failed to load.');
      return;
    }

    console.log('PDF: Building batch PDF with', data.length, 'responses');
    
    // Combine all submissions into one PDF with page breaks
    const content = [];
    data.forEach((entry, idx) => {
      if(idx > 0) {
        content.push({ text: '', pageBreak: 'before' });
      }
      const docDef = buildPdfDefinition(entry);
      content.push(...docDef.content);
    });

    const docDefinition = {
      pageSize: 'A4',
      pageMargins: [40, 40, 40, 40],
      content: content,
      styles: buildPdfDefinition(data[0]).styles,
      defaultStyle: {
        fontFamily: 'Poppins',
        fontSize: 10,
        color: '#404040'
      }
    };

    console.log('PDF: Creating batch document...');
    const pdf = pdfMake.createPdf(docDefinition);
    
    console.log('PDF: Downloading batch...');
    pdf.download(`all_design_brief_responses_${new Date().toISOString().slice(0,10)}.pdf`);
    console.log('PDF: Batch download complete');
  } catch(err) {
    console.error('PDF batch generation failed:', err);
    alert('PDF Error: ' + err.message);
  }
}

renderAll();
